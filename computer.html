<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Avni 🎉</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins', sans-serif;
      height:100vh;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
      background-size:400% 400%;
      animation:bgMove 10s ease infinite;
      padding:20px;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .card{
      width:100%;
      max-width:420px;
      background:rgba(255,255,255,0.18);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.3);
      border-radius:28px;
      padding:35px 25px;
      text-align:center;
      color:white;
      box-shadow:0 10px 35px rgba(0,0,0,0.2);
      animation:float 3s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{transform:translateY(0px);}
      50%{transform:translateY(-8px);}
    }

    .emoji{
      font-size:55px;
      margin-bottom:10px;
      animation:pop 1.5s infinite;
    }

    @keyframes pop{
      0%{transform:scale(1);}
      50%{transform:scale(1.15);}
      100%{transform:scale(1);}
    }

    h1{
      font-size:2rem;
      margin-bottom:10px;
      font-weight:700;
    }

    .name{
      color:#fff700;
      text-shadow:0 0 10px rgba(255,255,255,0.7);
    }

    p{
      font-size:1rem;
      line-height:1.7;
      margin-top:15px;
      color:#fff;
    }

    .btn{
      margin-top:28px;
      padding:14px 28px;
      border:none;
      border-radius:40px;
      background:white;
      color:#ff4b8a;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    .btn:hover{
      transform:scale(1.08);
      background:#fff0f5;
    }

    .footer{
      margin-top:22px;
      font-size:0.9rem;
      opacity:0.9;
    }

    @media(max-width:480px){
      h1{
        font-size:1.7rem;
      }

      p{
        font-size:0.95rem;
      }

      .card{
        padding:30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">🎂✨</div>

    <h1>Happy Birthday <span class="name">Avni</span> 💖</h1>

    <p>
      To my amazing best friend,<br><br>
      May your day be filled with happiness,
      laughter, love, and lots of unforgettable moments.
      Thank you for always being there.
      You truly make life brighter 🌸
    </p>

    <button class="btn" onclick="celebrate()">
      Celebrate 🎉
    </button>

    <div class="footer">
      Made with ❤️ by your bestie Siddhant 😊
    </div>
  </div>

  <script>
    // Auto confetti on load
    window.onload = () => {
      celebrate();
    };

    function celebrate() {

      // Main burst
      confetti({
        particleCount: 180,
        spread: 120,
        origin: { y: 0.6 }
      });

      // Left side
      confetti({
        particleCount: 80,
        angle: 60,
        spread: 70,
        origin: { x: 0 }
      });

      // Right side
      confetti({
        particleCount: 80,
        angle: 120,
        spread: 70,
        origin: { x: 1 }
      });
    }
  </script>

</body>
</html>
